<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Periodic Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Periodic Table of Elements</h1>

    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search elements by name or symbol...">
    </div>

    <div id="info-panel" class="info-panel-container">
    <p class="placeholder-text">Click on any element to view its details</p>
     <button id="reset-btn">Reset Details</button>

</div>

    
    <!-- This container will hold all our elements -->
     <div id="periodic-table" class="table-container">
     </div>


     <script src="script.js"></script>
    
</body>
</html>
